name: Issue 154 final fix

on:
  push:
    branches:
      - agent/issue-154-account-priority-catalog
    paths:
      - .github/workflows/issue-154-final-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/issue-154-account-priority-catalog
      - name: Apply exact fixes
        shell: python
        run: |
          from pathlib import Path
          path = Path("src/Unpwn.Core/RepositoryAccountClassificationCatalog.cs")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "new Dictionary<string, AccountRecoveryCategory>(StringComparer.Ordinal)":
                  "new(StringComparer.Ordinal)",
              "uri.Scheme is not (Uri.UriSchemeHttp or Uri.UriSchemeHttps))":
                  "(!string.Equals(uri.Scheme, Uri.UriSchemeHttp, StringComparison.OrdinalIgnoreCase) &&\n            !string.Equals(uri.Scheme, Uri.UriSchemeHttps, StringComparison.OrdinalIgnoreCase)))",
          }
          for before, after in replacements.items():
              if text.count(before) != 1:
                  raise SystemExit(f"Expected exactly one match for: {before}")
              text = text.replace(before, after)
          path.write_text(text, encoding="utf-8", newline="\n")
      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Unpwn.Core/RepositoryAccountClassificationCatalog.cs
          git commit -m "Fix catalog URI scheme validation"
          git push origin HEAD:agent/issue-154-account-priority-catalog
