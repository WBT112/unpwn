name: Provider recovery location smoke checks

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: provider-smoke-checks
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  NUGET_XMLDOC_MODE: skip

jobs:
  check-provider-locations:
    name: Check reviewed provider locations
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore smoke-check tool
        run: dotnet restore tools/Unpwn.ProviderSmokeChecks/Unpwn.ProviderSmokeChecks.csproj

      - name: Build smoke-check tool
        run: dotnet build tools/Unpwn.ProviderSmokeChecks/Unpwn.ProviderSmokeChecks.csproj --configuration Release --no-restore

      - name: Run read-only provider checks
        run: dotnet run --project tools/Unpwn.ProviderSmokeChecks/Unpwn.ProviderSmokeChecks.csproj --configuration Release --no-build
