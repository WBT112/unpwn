name: Issue 154 analyzer fix

on:
  push:
    branches:
      - agent/issue-154-account-priority-catalog
    paths:
      - .github/workflows/issue-154-analyzer-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/issue-154-account-priority-catalog
      - name: Apply exact analyzer fixes
        shell: python
        run: |
          from pathlib import Path
          path = Path("src/Unpwn.Core/RepositoryAccountClassificationCatalog.cs")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "private static readonly IReadOnlyDictionary<string, AccountRecoveryCategory> CategoryHintAliases =":
                  "private static readonly Dictionary<string, AccountRecoveryCategory> CategoryHintAliases =",
              "Array.AsReadOnly(new[] { domain }),": "Array.AsReadOnly([domain]),",
              "private static IReadOnlyList<string> LoadSourceDomains(string resourceFileName)":
                  "private static List<string> LoadSourceDomains(string resourceFileName)",
          }
          for before, after in replacements.items():
              if text.count(before) != 1:
                  raise SystemExit(f"Expected exactly one match for: {before}")
              text = text.replace(before, after)
          path.write_text(text, encoding="utf-8", newline="\n")
      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Unpwn.Core/RepositoryAccountClassificationCatalog.cs
          git commit -m "Fix catalog analyzer findings"
          git push origin HEAD:agent/issue-154-account-priority-catalog
