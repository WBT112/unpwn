name: Catalog bootstrap

on:
  push:
    branches:
      - agent/issue-154-provider-catalog

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out issue branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Generate pinned provider catalog
        run: python3 eng/update-account-classification-catalog.py

      - name: Verify generated data
        run: |
          test -s src/Unpwn.Core/Data/account-classification-catalog.tsv
          test -s src/Unpwn.Core/Data/account-classification-catalog.meta.json
          git diff --check

      - name: Commit generated catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Unpwn.Core/Data/account-classification-catalog.tsv src/Unpwn.Core/Data/account-classification-catalog.meta.json
          if git diff --cached --quiet; then
            echo "Catalog is already current."
            exit 0
          fi
          git commit -m "Generate broad offline account catalog"
          git push origin HEAD:agent/issue-154-provider-catalog
