name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  NUGET_XMLDOC_MODE: skip

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore unpwn.slnx

      - name: Verify formatting
        if: runner.os == 'Linux'
        run: dotnet format unpwn.slnx --no-restore --verify-no-changes --severity info

      - name: Build
        run: dotnet build unpwn.slnx --configuration Release --no-restore

      - name: Install Playwright Chromium and system dependencies
        if: runner.os == 'Linux'
        shell: pwsh
        run: tests/Unpwn.SyntheticProvider.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Install Playwright Chromium
        if: runner.os == 'Windows'
        shell: pwsh
        run: tests/Unpwn.SyntheticProvider.Tests/bin/Release/net10.0/playwright.ps1 install chromium

      - name: Build and test with coverage
        if: runner.os == 'Linux'
        run: >-
          dotnet test unpwn.slnx
          --configuration Release
          --no-build
          --collect:"XPlat Code Coverage"
          --results-directory artifacts/test-results
          --logger "trx;LogFilePrefix=${{ runner.os }}"
          --
          DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Restore coverage report tool
        if: runner.os == 'Linux'
        run: dotnet tool restore

      - name: Merge and verify coverage
        if: runner.os == 'Linux'
        shell: pwsh
        run: |
          dotnet tool run reportgenerator `
            '-reports:artifacts/test-results/**/coverage.cobertura.xml' `
            '-targetdir:artifacts/coverage' `
            '-reporttypes:Cobertura;JsonSummary;TextSummary' `
            '-assemblyfilters:+Unpwn.*;-Unpwn.App'
          ./eng/verify-coverage.ps1 `
            -CoveragePath artifacts/coverage/Cobertura.xml `
            -MinimumLineRate 0.80 `
            -MinimumBranchRate 0.80

      - name: Build and test
        if: runner.os == 'Windows'
        run: >-
          dotnet test unpwn.slnx
          --configuration Release
          --no-build
          --results-directory artifacts/test-results
          --logger "trx;LogFilePrefix=${{ runner.os }}"

      - name: Verify test artifacts are secret-safe
        id: secret-scan
        if: always()
        shell: pwsh
        run: |
          $secretMatches = Get-ChildItem artifacts -Recurse -File -ErrorAction SilentlyContinue |
            Select-String -SimpleMatch 'UNPWN_TEST_SECRET_'

          if ($secretMatches) {
            Write-Error 'Synthetic secret markers were found in test artifacts. Artifacts will not be uploaded.'
            exit 1
          }

      - name: Upload Linux test results and coverage
        if: ${{ always() && runner.os == 'Linux' && steps.secret-scan.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ runner.os }}
          path: |
            artifacts/test-results
            artifacts/coverage
          if-no-files-found: warn
          retention-days: 7

      - name: Upload failed Windows test results
        if: ${{ failure() && runner.os == 'Windows' && steps.secret-scan.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ runner.os }}
          path: artifacts/test-results
          if-no-files-found: warn
          retention-days: 7
